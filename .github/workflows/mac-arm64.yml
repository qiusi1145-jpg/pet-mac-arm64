name: mac-arm64 出包与全量回归

# 为什么需要这条流水线：
#   arm64 包目前只能从 x86_64 虚拟机里**交叉**产出（用户没有任何 Apple Silicon 机器）。
#   交叉出包能静态证明"结构对、架构对、签名对"，但证明不了"在真 arm64 上跑得起来"——
#   而 Apple Silicon 是内核级强制签名，漏一个二进制就是开不了机（Killed: 9）。
#   GitHub 托管的 macos-15 运行器是真 M1 arm64，公共仓库免费。在这里出包还顺带消掉
#   交叉编译那两类架构漏洞（Electron 按本机架构下载、helper 忘了 -arch）。
#
# 注意：私有仓库的 macOS 分钟数**要花钱**（超出套餐额度后 $0.062/分钟），
#       只有公共仓库才是完全免费。见 README 里的说明。

on:
  workflow_dispatch:          # 手动跑一次（发版前用这个）
  push:
    branches: [master]

jobs:
  package-and-verify:
    runs-on: macos-15
    timeout-minutes: 45
    # 贴 commit 评论需要 contents 写权限。Actions 的默认令牌**只有读**，
    # 不加这一段的话 gh api 会 403，而那又被 continue-on-error 盖成 success ——
    # 实测踩过：job 全绿、评论数 0、日志等于没留。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 架构必须当场核对：GitHub 哪天换默认架构，宁可这里直接红，
      # 也不要产出一份"名字叫 arm64、里面混着 x86_64"的包 —— 这个坑本地踩过两次。
      - name: 确认运行器是 arm64 真机
        run: |
          uname -a
          [ "$(uname -m)" = arm64 ] || { echo "❌ 运行器架构不是 arm64，而是 $(uname -m)"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 原生出包：编译打字探针 → 装依赖 → ad-hoc 签名（由内向外）→ 清隔离 → 逐个 Mach-O 校验
      # tee 到 $RUNNER_TEMP 是为了让最后那步能把日志贴成 commit 评论（见文件末尾的说明）。
      #
      # ⚠ shell: bash 不是可有可无的：GitHub 步骤**默认** shell 是 `bash -e {0}`，不带 pipefail，
      #   于是 `cmd | tee` 的退出码取的是 tee 的 0 —— 实测这样把一次真实的 UI 失败洗成了
      #   step success + job.status success。指定 shell: bash 才会加 `-eo pipefail`。
      - name: 出包（本机架构 = arm64，不交叉）
        shell: bash
        run: sh tools/mac-package.sh 2>&1 | tee "$RUNNER_TEMP/package.log"

      # ⚠ 验证跑在**分发包本身**上，不是开发树：装配漏文件、签名顺序错、
      #   探针没随包走，这类问题只有在产物上跑才暴露得出来。
      #   verify-vm.sh 含：L1 单测 / L2 冒烟 / L3 UI ×2（默认缩放 + devicePixelRatio=2）/
      #   签名清点 / 探针静态检查。语音段因包里不含模型而自动降级跳过。
      - name: 对分发包跑全量验证
        shell: bash
        run: |
          cd dist/桌宠-mac-arm64
          sh tools/verify-vm.sh 2>&1 | tee "$RUNNER_TEMP/verify.log"

      # 只有 ditto 会保留 .command / keybeat 的可执行位与签名（Windows 压缩软件会把执行位弄丢）
      - name: 打成 zip 并给出 sha256
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent 桌宠-mac-arm64 桌宠-mac-arm64.zip
          shasum -a 256 桌宠-mac-arm64.zip | tee 桌宠-mac-arm64.zip.sha256.txt
          du -h 桌宠-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          # artifact 名只允许 [a-zA-Z0-9._-]，中文会被 action 直接拒掉 —— 别改成中文。
          # 下载下来的文件名由 path 里的 zip 决定，不受这里影响。
          name: pet-mac-arm64
          path: |
            dist/桌宠-mac-arm64.zip
            dist/桌宠-mac-arm64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 90

      # 把打包/验证日志贴成 **commit 评论**。为什么用这个而不是 artifact：
      # artifact 和 job 日志的 API 都要登录（实测 403 Must have admin rights），
      # 而公共仓库的 commit 评论**不需要凭据就能读** —— 出包在真 arm64 上失败时，
      # 不用麻烦别人手动贴日志，直接 GET 这条评论就能定位。
      # 只在失败时也想看到内容，所以 if: always()；贴失败绝不把整个 job 带崩。
      - name: 把日志贴成 commit 评论（公开可读）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "结论：${{ job.status }}"
            echo "运行器：$(uname -m) / $(sw_vers -productVersion 2>/dev/null || echo '?')"
            echo "运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            # 失败摘要放在**最前面**：正文有长度上限，只靠 tail 会把先跑的场景截掉，
            # 实测就是这样丢了那条真正失败的场景名，白跑一轮。
            echo '===== 失败摘要（从整份日志挑，不受截断影响）====='
            echo '```'
            grep -nE "SCENARIO [A-Za-z]+ FAIL|FAIL code=|TIMEOUT|断言失败|退出码=[^0]|❌" \
              "$RUNNER_TEMP/verify.log" "$RUNNER_TEMP/package.log" 2>/dev/null | head -40 || echo "(无匹配)"
            echo '```'
            echo '===== 本次跑出来的测量值（每次都留痕，不只失败时才有）====='
            echo '```'
            grep -nE "\[scenario\] .*实测" /tmp/deskpet-verify/raw.log "$RUNNER_TEMP/verify.log" 2>/dev/null \
              | sed 's#^[^:]*:[0-9]*: *##' | sort -u | head -20 || echo "(无)"
            echo '```'
            echo '===== 失败场景的上下文（含 stderr 头几行）-----'
            echo '```'
            grep -A 12 "FAIL code=" "$RUNNER_TEMP/verify.log" 2>/dev/null | head -80 || echo "(无)"
            echo '```'
            # verify-vm.sh 把子进程的完整输出留在 runner 本地的 raw.log 里（报告只回显尾部若干行），
            # 同一台机器上直接读它，才能拿到被尾部窗口截掉的那段。
            echo '===== raw.log 里的失败详情 ====='
            echo '```'
            grep -nE "SCENARIO [A-Za-z]+ FAIL|FAIL code=|TIMEOUT|断言失败|Error:|error:" \
              /tmp/deskpet-verify/raw.log 2>/dev/null | head -60 || echo "(没有 raw.log)"
            echo '```'
            echo '----- raw.log 失败场景的 stderr 上下文 -----'
            echo '```'
            grep -B 2 -A 14 "FAIL code=" /tmp/deskpet-verify/raw.log 2>/dev/null | head -120 || echo "(无)"
            echo '```'
            echo '===== package.log 尾部 ====='
            echo '```'
            tail -c 12000 "$RUNNER_TEMP/package.log" 2>/dev/null
            echo '```'
            echo '===== verify.log 尾部 ====='
            echo '```'
            tail -c 12000 "$RUNNER_TEMP/verify.log" 2>/dev/null
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          # GitHub 评论正文上限 65536 字符，超了 API 返 422 —— 而那会被 continue-on-error 盖掉，
          # 等于"留痕步骤安静地失败"。所以这里硬截断，保证评论一定发得出去。
          node -e '
            const fs = require("fs");
            let body = fs.readFileSync(process.env.RUNNER_TEMP + "/comment.md", "utf8");
            if (body.length > 60000) body = body.slice(0, 30000) + "\n\n…（中间截断）…\n\n" + body.slice(-28000);
            process.stdout.write(JSON.stringify({ body }));
          ' > "$RUNNER_TEMP/payload.json"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input "$RUNNER_TEMP/payload.json"
