<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
  />
  <title>学习计划表</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fafafa; color: #222;
      font: 13px/1.6 "Microsoft YaHei", sans-serif; user-select: none; -webkit-user-select: none; }
    body { position: relative; display: flex; flex-direction: column; box-sizing: border-box;
      padding: 12px 14px 10px; overflow: hidden; }
    /* 桌宠装饰层：主图缩小后贴在右下角，纯装饰（不吃鼠标事件） */
    #deco { position: absolute; bottom: 0; right: 6px; z-index: 0;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.10)); }
    #deco.left { right: auto; left: 6px; }
    header, .week, #addRow, main, footer { position: relative; z-index: 1; }
    header { display: flex; align-items: baseline; gap: 10px; }
    header h1 { font-size: 15px; margin: 0; }
    header .tip { color: #888; font-size: 12px; flex: 1 1 auto; }
    header .prog { color: #2a8a3a; font-size: 12px; font-weight: 700; }
    .week { display: flex; gap: 5px; margin: 9px 0 8px; }
    .day { flex: 1 1 0; min-width: 0; border: 1px solid #e4e4e4; border-radius: 8px;
      background: #fff; padding: 5px 4px 6px; text-align: center; cursor: pointer; }
    .day:hover { background: #f4f9ff; border-color: #bcd9f5; }
    .day .dw { font-size: 11px; color: #888; }
    .day .dd { font-size: 13px; font-weight: 700; }
    .day .dot { font-size: 10px; color: #2a8a3a; min-height: 12px; }
    .day.sel { background: #eaf4ff; border-color: #2f9bff; }
    .day.today .dd { color: #2f9bff; }
    #addRow { display: flex; gap: 6px; align-items: center; padding: 8px;
      border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    #addRow input[type=text] { flex: 1 1 auto; min-width: 0; }
    input[type=text], input[type=date], input[type=time] { font: 13px/1.6 "Microsoft YaHei";
      padding: 3px 7px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
    main { flex: 1 1 auto; overflow: auto; margin-top: 9px; padding-right: 96px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 6px 9px;
      border: 1px solid #e6e6e6; border-radius: 8px; background: #fff; margin-bottom: 6px; }
    .row .ck { flex: 0 0 auto; }
    .row .tm { flex: 0 0 46px; color: #2f6fb8; font-size: 12px; }
    .row .tx { flex: 1 1 auto; word-break: break-all; }
    .row.done .tx { color: #aaa; text-decoration: line-through; }
    .row.overdue .tm { color: #cc4444; }
    .row .delBtn { flex: 0 0 auto; border: none; background: none; color: #999; font-size: 13px; }
    .row .delBtn:hover { color: #e05555; }
    .sec { color: #999; font-size: 11px; margin: 10px 0 5px; }
    .empty { color: #bbb; text-align: center; padding: 22px 0; }
    footer { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid #eee; }
    footer .msg { flex: 1 1 auto; color: #2a8a3a; font-size: 12px; min-height: 18px; }
    footer .msg.err { color: #cc4444; }
    button { font: 12px/1.6 "Microsoft YaHei"; padding: 3px 12px; border-radius: 6px;
      border: 1px solid #bbb; background: #f2f2f2; cursor: pointer; }
    button:hover { background: #e5f1fb; }
    button.primary { background: #2f9bff; border-color: #1b7fdd; color: #fff; font-weight: 700; }
    button.primary:hover { background: #1f8aef; }
  </style>
</head>
<body>
  <img id="deco" alt="" draggable="false" />
  <header>
    <h1>学习计划表</h1>
    <span class="tip" id="tip"></span>
    <span class="prog" id="prog"></span>
  </header>

  <div class="week" id="week"></div>

  <section id="addRow">
    <input id="text" type="text" maxlength="200" placeholder="要做什么，例如：背 50 个单词" spellcheck="false" />
    <input id="date" type="date" />
    <input id="time" type="time" />
    <button id="addBtn" class="primary">添加</button>
  </section>

  <main id="list"></main>

  <footer>
    <span class="msg" id="msg"></span>
    <button id="todayBtn">回到今天</button>
  </footer>
  <script src="./planner.js"></script>
</body>
</html>
