<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
  />
  <title>学习计划表</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.6 "Microsoft YaHei", sans-serif; user-select: none; -webkit-user-select: none; }
    body { position: relative; display: flex; flex-direction: column; box-sizing: border-box;
      padding: 12px 14px 10px; overflow: hidden; }
    /* 桌宠装饰层：主图缩小后贴在右下角，纯装饰（不吃鼠标事件） */
    #deco { position: absolute; bottom: 0; right: 6px; z-index: 0;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.10)); }
    #deco.left { right: auto; left: 6px; }
    header, .week, #addRow, main, footer { position: relative; z-index: 1; }
    header { display: flex; align-items: baseline; gap: 10px; }
    header h1 { font-size: 15px; margin: 0; }
    header .tip { color: var(--text-3); font-size: 12px; flex: 1 1 auto; }
    header .prog { color: var(--ok); font-size: 12px; font-weight: 700; }
    .week { display: flex; gap: 5px; margin: 9px 0 8px; }
    .day { flex: 1 1 0; min-width: 0; border: 1px solid var(--hairline); border-radius: var(--r-md);
      background: var(--card); padding: 5px 4px 6px; text-align: center; cursor: pointer; }
    .day:hover { background: var(--hover-tint); border-color: #c9def2; }
    .day .dw { font-size: 11px; color: var(--text-3); }
    .day .dd { font-size: 13px; font-weight: 700; }
    .day .dot { font-size: 10px; color: var(--ok); min-height: 12px; }
    .day.sel { background: var(--accent-weak); border-color: var(--accent); }
    .day.today .dd { color: var(--accent); }
    #addRow { display: flex; gap: 6px; align-items: center; padding: 8px;
      border: 1px solid var(--card-border); border-radius: var(--r-md); background: var(--card); }
    #addRow input[type=text] { flex: 1 1 auto; min-width: 0; }
    input[type=text], input[type=date], input[type=time] { font: 13px/1.6 "Microsoft YaHei"; color: var(--text);
      padding: 3px 7px; border: 1px solid var(--input-border); border-radius: var(--r-sm); background: var(--card); }
    main { flex: 1 1 auto; overflow: auto; margin-top: 9px; padding-right: 96px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 6px 9px;
      border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--card); margin-bottom: 6px; }
    .row .ck { flex: 0 0 auto; }
    .row .tm { flex: 0 0 46px; color: var(--accent-strong); font-size: 12px; }
    .row .tx { flex: 1 1 auto; word-break: break-all; }
    .row.done .tx { color: var(--text-3); text-decoration: line-through; }
    .row.overdue .tm { color: var(--bad); }
    .row .delBtn { flex: 0 0 auto; border: none; background: none; color: var(--text-3); font-size: 13px; }
    .row .delBtn:hover { color: var(--bad); }
    .sec { color: var(--text-3); font-size: 11px; margin: 10px 0 5px; }
    .empty { color: var(--text-3); text-align: center; padding: 22px 0; }
    footer { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); }
    footer .msg { flex: 1 1 auto; color: var(--ok); font-size: 12px; min-height: 18px; }
    footer .msg.err { color: var(--bad); }
    button { font: 12px/1.6 "Microsoft YaHei"; padding: 3px 12px; border-radius: var(--r-sm);
      border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text); cursor: pointer; }
    button:hover { background: var(--accent-weak); }
    button.primary { background: var(--accent); border-color: var(--accent-strong); color: var(--on-accent); font-weight: 700; }
    button.primary:hover { background: var(--accent-strong); }
  </style>
</head>
<body>
  <img id="deco" alt="" draggable="false" />
  <header>
    <h1>学习计划表</h1>
    <span class="tip" id="tip"></span>
    <span class="prog" id="prog"></span>
  </header>

  <div class="week" id="week"></div>

  <section id="addRow">
    <input id="text" type="text" maxlength="200" placeholder="要做什么，例如：背 50 个单词" spellcheck="false" />
    <input id="date" type="date" />
    <input id="time" type="time" />
    <button id="addBtn" class="primary">添加</button>
  </section>

  <main id="list"></main>

  <footer>
    <span class="msg" id="msg"></span>
    <button id="todayBtn">回到今天</button>
  </footer>
  <script src="./planner.js"></script>
</body>
</html>
