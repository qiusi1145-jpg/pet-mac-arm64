<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
  />
  <title>待办清单</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.6 "Microsoft YaHei", sans-serif; user-select: none; -webkit-user-select: none; }
    body { display: flex; flex-direction: column; box-sizing: border-box; padding: 12px 14px; }
    header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    header h1 { font-size: 16px; margin: 0; }
    header #count { color: var(--text-3); font-size: 12px; }
    #addRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px; border: 1px solid var(--card-border); border-radius: var(--r-md); background: var(--card); }
    #text { flex: 1 1 100%; font: 13px/1.6 "Microsoft YaHei"; padding: 4px 8px; color: var(--text);
      border: 1px solid var(--input-border); border-radius: var(--r-sm); }
    #addRow label { display: flex; align-items: center; gap: 4px; color: var(--text-2); font-size: 12px; }
    #due { font: 12px/1.4 "Microsoft YaHei"; border: 1px solid var(--input-border);
      border-radius: var(--r-sm); padding: 2px 4px; color: var(--text); }
    button { font: 12px/1.6 "Microsoft YaHei"; padding: 3px 12px; border-radius: var(--r-sm);
      border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text); cursor: pointer; }
    button:hover { background: var(--accent-weak); }
    button.primary { background: var(--accent); border-color: var(--accent-strong); color: var(--on-accent); font-weight: 700; }
    button.primary:hover { background: var(--accent-strong); }
    #list { flex: 1 1 auto; overflow: auto; margin-top: 8px; }
    .row { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px;
      border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--card); margin-bottom: 6px; }
    .row .doneCk { margin-top: 3px; }
    .row .body { flex: 1 1 auto; min-width: 0; }
    .row .txt { word-break: break-all; white-space: pre-wrap; }
    .row.done .txt { text-decoration: line-through; color: var(--text-3); }
    .row .meta { font-size: 11px; color: var(--text-3); }
    .row .meta.overdue { color: var(--bad); font-weight: 700; }
    .row .impBtn { border: none; background: none; font-size: 15px; color: #d9708f; padding: 0 4px; }
    .row .impBtn.off { color: #cfd4d9; }
    .row .delBtn { border: none; background: none; color: var(--text-3); font-size: 13px; padding: 0 4px; }
    .row .delBtn:hover { color: var(--bad); }
    .empty { color: var(--text-3); text-align: center; padding: 30px 0; }
  </style>
</head>
<body>
  <header><h1>待办清单</h1><span id="count"></span></header>
  <section id="addRow">
    <input id="text" type="text" maxlength="200" placeholder="要做点什么？（Enter 添加）" spellcheck="false" />
    <label class="imp"><input id="important" type="checkbox" />♥ 重要</label>
    <label class="due">截止 <input id="due" type="datetime-local" /></label>
    <button id="addBtn" class="primary">添加</button>
  </section>
  <main id="list"></main>
  <script src="./todo.js"></script>
</body>
</html>
