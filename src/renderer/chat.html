<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
  />
  <title>聊天</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fafafa; color: #222;
      font: 13px/1.6 "Microsoft YaHei", sans-serif; user-select: none; -webkit-user-select: none; }
    body { display: flex; flex-direction: column; box-sizing: border-box; padding: 10px 12px; }
    #msgs { flex: 1 1 auto; overflow: auto; padding: 4px 2px; }
    .msg { max-width: 78%; margin: 5px 0; padding: 6px 10px; border-radius: 10px;
      word-break: break-all; white-space: pre-wrap; }
    .msg.me { background: #2f9bff; color: #fff; margin-left: auto; }
    .msg.pet { background: #ececec; color: #222; margin-right: auto; }
    .msg.sys { background: none; color: #999; font-size: 11px; text-align: center;
      max-width: 100%; padding: 2px; }
    #inputRow { display: flex; gap: 6px; margin-top: 8px; }
    #input { flex: 1 1 auto; font: 13px/1.6 "Microsoft YaHei"; padding: 5px 8px;
      border: 1px solid #ccc; border-radius: 7px; }
    #sendBtn { flex: 0 0 auto; }
    button { font: 13px/1.6 "Microsoft YaHei"; padding: 4px 14px; border-radius: 7px;
      border: 1px solid #1b7fdd; background: #2f9bff; color: #fff; font-weight: 700; cursor: pointer; }
    button:hover { background: #1f8aef; }
  </style>
</head>
<body>
  <main id="msgs"></main>
  <footer id="inputRow">
    <input id="input" type="text" maxlength="500" placeholder="和桌宠聊聊…（Enter 发送）" spellcheck="false" />
    <button id="sendBtn">发送</button>
  </footer>
  <script src="./chat.js"></script>
</body>
</html>
