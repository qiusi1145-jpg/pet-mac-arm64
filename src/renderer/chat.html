<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
  />
  <title>聊天</title>
  <link rel="stylesheet" href="./apple.css" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none; -webkit-user-select: none; }
    body { display: flex; flex-direction: column; box-sizing: border-box; padding: 12px 14px; }
    #msgs { flex: 1 1 auto; overflow: auto; padding: 4px 2px; }
    .msg { max-width: 78%; margin: 5px 0; padding: 6px 10px; border-radius: var(--r-lg);
      word-break: break-all; white-space: pre-wrap; }
    .msg.me { background: var(--accent); color: var(--on-accent); margin-left: auto;
      box-shadow: var(--shadow-soft); }
    .msg.pet { background: var(--card); color: var(--text); margin-right: auto;
      border: 1px solid var(--card-border); box-shadow: var(--shadow-soft); }
    .msg.sys { background: none; color: var(--text-3); font-size: 11px; text-align: center;
      max-width: 100%; padding: 2px; }
    #inputRow { display: flex; gap: 6px; margin-top: 8px; }
    /* 语音"正在输入"实时条：在听 / 正在识别 / 实时字幕 + 电平条 */
    #live { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 8px;
      border-radius: var(--r-md); background: var(--accent-weak); border: 1px solid #cfe0f2; color: #3a6c9c;
      font-size: 12px; }
    #live[hidden] { display: none; }
    #live.busy { background: var(--warn-bg); border-color: #ecd9b0; color: var(--warn); }
    #live .mic { flex: 0 0 auto; }
    #live .txt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    #live .bar { flex: 0 0 44px; height: 6px; border-radius: 3px; background: rgba(74, 144, 217, 0.18);
      overflow: hidden; }
    #live .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
    #input { flex: 1 1 auto; font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 6px 10px; color: var(--text); background: var(--card);
      border: 1px solid var(--input-border); border-radius: var(--r-md); }
    #input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
    #sendBtn { flex: 0 0 auto; }
    /* 请求进行中才出现的「停止」（大模型可能要等几秒；点了立刻取消在途请求） */
    #stopBtn { flex: 0 0 auto; border: none; background: var(--bad-bg); color: var(--bad); }
    #stopBtn[hidden] { display: none; }
    #micBtn { flex: 0 0 auto; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text);
      font-weight: 400; padding: 5px 12px; box-shadow: none; }
    #micBtn:hover { background: var(--hover-tint); }
    #micBtn.on { border: none; background: var(--bad); color: var(--on-accent); }
    /* 按住说话时：蓝色（区别于"对话中"的红色）。放在 .on 之后 → 同时命中时以"正在按"为准 */
    #micBtn.hold { border: none; background: var(--accent); color: var(--on-accent); }
    #micBtn[hidden] { display: none; }
    button { font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 5px 16px; border-radius: var(--r-sm);
      border: none; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer;
      box-shadow: var(--shadow-soft); }
    button:hover { background: var(--accent-strong); }
  </style>
</head>
<body>
  <main id="msgs"></main>
  <div id="live" hidden>
    <span class="mic">🎤</span>
    <span class="txt">在听…</span>
    <span class="bar"><i></i></span>
  </div>
  <footer id="inputRow">
    <input id="input" type="text" maxlength="500" placeholder="和桌宠聊聊…（Enter 发送）" spellcheck="false" />
    <button id="micBtn" hidden title="语音对话：点击进入 / 再点退出，或按住说话（键位可自定义）">🎤</button>
    <button id="stopBtn" hidden title="取消这次请求（Esc）">停止</button>
    <button id="sendBtn">发送</button>
  </footer>
  <script src="./chat.js"></script>
</body>
</html>
