<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
  />
  <title>通用设置</title>
  <link rel="stylesheet" href="./apple.css" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none; -webkit-user-select: none; }
    body { display: flex; flex-direction: column; box-sizing: border-box; padding: 14px 16px; }
    header h1 { font-size: 15px; margin: 0 0 3px; font-weight: 600; }
    header .tip { color: var(--text-3); font-size: 12px; margin-bottom: 10px; }
    main { flex: 1 1 auto; overflow: auto; }
    section { border: 1px solid var(--card-border); border-radius: var(--r-md); background: var(--card);
      box-shadow: var(--shadow-soft); padding: 12px 14px; margin-bottom: 12px; }
    section h2 { font-size: 13px; margin: 0 0 10px; color: var(--text); font-weight: 600; }
    #swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .sw { display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 10px 4px 8px; border: 1px solid var(--card-border); border-radius: var(--r-md);
      background: var(--card); cursor: pointer; transition: transform 0.08s; }
    .sw:hover { background: var(--hover-tint); }
    .sw:active { transform: scale(0.96); }
    .sw .dot { width: 26px; height: 26px; border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08); }
    .sw .nm { font-size: 12px; color: var(--text-2); }
    .sw.on { border-color: var(--accent); box-shadow: var(--focus-ring); }
    .sw.on .nm { color: var(--text); font-weight: 600; }
    .hint { color: var(--text-3); font-size: 11px; margin: 10px 0 0; }
    footer { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); }
    footer .msg { flex: 1 1 auto; color: var(--ok); font-size: 12px; min-height: 18px; }
    footer .msg.err { color: var(--bad); }
  </style>
</head>
<body>
  <header>
    <h1>通用设置</h1>
    <div class="tip">跨窗口的外观偏好，改完立刻生效。</div>
  </header>
  <main>
    <section>
      <h2>界面主题色</h2>
      <div id="swatches"></div>
      <p class="hint">作用于聊天、待办、设置等工具窗口；「学习」模块窗口和桌宠本体不受影响。</p>
    </section>
  </main>
  <footer><span class="msg" id="msg"></span></footer>
  <script src="./generalSettings.js"></script>
</body>
</html>
